
version: "3.7"
services:

  tracardi-api:
    #    image: tracardi/tracardi-api:1.1.6
    build:
      context: .
      dockerfile: docker.Dockerfile
    restart: on-failure
    environment:
      ELASTIC_HOST: http://elasticsearch:9200
      REDIS_HOST: redis://redis:6379
      MYSQL_HOST: mysql
      LOGGING_LEVEL: info
      DEMO: "yes"
      PRODUCTION: "no"
      SAVE_LOGS: "no"
    ports:
      - 8686:80
    depends_on:
      - redis
      - elasticsearch
      - mysql

  tracardi-gui:
    image: tracardi/tracardi-gui:1.1.6
    ports:
      - 8787:80
    depends_on:
      - tracardi-api

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.13.2
    environment:
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.name: ElasticSearchCluster
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  redis:
    image: redis
    ports:
      - "6379:6379"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tracardi
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mydata:/var/lib/mysql


  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      # Listeners
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL


      # --- General ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
    depends_on:
      - kafka


  worker:
    # image: tracardi/update-worker:1.1.2
    build:
      context: .
      dockerfile: tracardi/docker.worker.Dockerfile
    platform: linux/amd64
    environment:
      ELASTIC_HOST: http://elasticsearch:9200
      REDIS_HOST: redis://redis:6379
      MYSQL_HOST: mysql
      RUN_KAFKA_CONSUMER: "yes"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPIC: "tracardi.events"
      KAFKA_GROUP_ID: "tracardi.worker"
      KAFKA_AUTO_OFFSET_RESET: "earliest"
    depends_on:
      - redis
      - elasticsearch
      - mysql
      - kafka

  apm:
    image: tracardi/apm:1.1.2
    environment:
      ELASTIC_HOST: http://elasticsearch:9200
      REDIS_HOST: redis://redis:6379
      MYSQL_HOST: mysql
      MODE: "worker"
      PAUSE: 15
    depends_on:
      - redis
      - elasticsearch
      - mysql

volumes:
  es-data:
    driver: local
  mydata:
    driver: local
